[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "amaranth-stubs"
dynamic = ["version"]
readme = "README.md"
dependencies = [
    "amaranth ~= 0.5.4"
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
]
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]

[dependency-groups]
lint = [
    "pyright == 1.1.393",
    "ruff == 0.16.5"
]

[tool.setuptools_scm]

[tool.pyright]
include = ["amaranth-stubs", "amaranth_types"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle error
    "W",    # pycodestyle warning
    "F",    # pyflakes
    "PLE"   # pylint error
]
ignore = [
    "F403", # star imports
    "F405", # use of name from star imports
    "E501"  # line too long
]
